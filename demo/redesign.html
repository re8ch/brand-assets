<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RE8CH · Navigation & Footer Preview</title>
  <link rel="stylesheet" href="../dist/re8ch-navigator.css">
  <link rel="stylesheet" href="../dist/re8ch-footer.css">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; background: #f8fafc; color: #142033; font-family: ui-sans-serif, system-ui, sans-serif; }
    html[data-theme="dark"] { color-scheme: dark; background: #0b1220; color: #f8fafc; }
    body { margin: 0; }
    main { max-width: 1240px; padding: 84px 40px 72px; margin: auto; min-height: 390px; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; opacity: .6; }
    h1 { font-size: clamp(30px, 4vw, 52px); line-height: 1.2; letter-spacing: -.04em; font-weight: 550; margin: 24px 0 20px; }
    p { max-width: 640px; line-height: 1.8; font-size: 15px; opacity: .65; }
    @media (max-width: 760px) { main { padding: 54px 24px; min-height: 330px; } }
  </style>
  <script src="../dist/re8ch-navigator.js" defer></script>
  <script src="../dist/re8ch-footer.js" defer></script>
</head>
<body>
  <re8ch-navigator product="re8ch" locale="zh-CN" brand="RE8CH" home-href="./redesign.html" language-mode="available" language-options='[{"value":"zh-CN","label":"简体中文","nativeLabel":"简体中文"},{"value":"en","label":"English","nativeLabel":"English"}]' links='[{"label":"产品","href":"#products"},{"label":"关于我们","href":"#about"}]'></re8ch-navigator>
  <main id="about"><div class="eyebrow">RE8CH / SHARED COMPONENTS</div><h1>让每一次探索，<br>更清晰、更从容。</h1><p>导航与页脚交互预览 · 切换语言与明暗外观，调整玻璃透明度；在底部查看企业公开记录。</p></main>
  <re8ch-footer id="products" brand-logo="../SVG/logo.svg" locale="zh-CN"></re8ch-footer>
<script>
    const supported = ['en','zh-CN','zh-TW','es','ar','hi','pt-BR','bn','ru','ja','fr','de','ko','id','tr','vi','it','fa','ur','th','pl','nl','sw','ms','fil','uk','he'];
    const navigatorElement = document.querySelector('re8ch-navigator');
    navigatorElement.setAttribute('language-options', JSON.stringify(supported.map(value => ({
      value, label: new Intl.DisplayNames(['en'], {type:'language'}).of(value),
      nativeLabel: new Intl.DisplayNames([value], {type:'language'}).of(value)
    }))));
    const params = new URLSearchParams(location.search);
    if (supported.includes(params.get('locale'))) {
      navigatorElement.setAttribute('locale', params.get('locale'));
      document.querySelector('re8ch-footer').setAttribute('locale', params.get('locale'));
    }
    if (params.has('few')) {
      document.querySelector('re8ch-footer').setAttribute('product-ids', 'ledger,anycam');
      document.querySelector('re8ch-footer').setAttribute('record-ids', 'icp,duns');
    }
  </script>
</body>
</html>
