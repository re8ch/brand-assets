<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">CompoCV</title>
  <desc id="desc">A transparent Sichuan opera face-changing mask layered with animated resume pages.</desc>
  <defs>
    <linearGradient id="page" x1="25" y1="18" x2="99" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="maskBlue" x1="26" y1="23" x2="105" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="maskRed" x1="38" y1="15" x2="96" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .page-sheet {
        animation: pageShift 5.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 52% 52%;
      }
      .mask-core {
        animation: maskFloat 4.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 52%;
      }
      .left-face {
        animation: faceLeft 3.4s ease-in-out infinite;
      }
      .right-face {
        animation: faceRight 3.4s ease-in-out infinite;
      }
      .eye-dot {
        animation: eyeBlink 3.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .whisker {
        animation: whiskerSweep 4.8s ease-in-out infinite;
        transform-box: fill-box;
      }
      @keyframes pageShift {
        0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: .96; }
        45% { transform: translate(2px, -2px) rotate(1.2deg); opacity: .84; }
        70% { transform: translate(-1px, 1px) rotate(-.8deg); opacity: .92; }
      }
      @keyframes maskFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-2px) scale(1.015); }
      }
      @keyframes faceLeft {
        0%, 100% { opacity: .98; }
        50% { opacity: .72; }
      }
      @keyframes faceRight {
        0%, 100% { opacity: .76; }
        50% { opacity: 1; }
      }
      @keyframes eyeBlink {
        0%, 88%, 100% { transform: scaleY(1); }
        92% { transform: scaleY(.18); }
      }
      @keyframes whiskerSweep {
        0%, 100% { transform: translateX(0); opacity: .9; }
        50% { transform: translateX(1.6px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .page-sheet,
        .mask-core,
        .left-face,
        .right-face,
        .eye-dot,
        .whisker { animation: none; }
      }
    </style>
  </defs>
  <g class="page-sheet" filter="url(#shadow)">
    <path d="M35 16h46l18 18v69c0 6.1-4.9 11-11 11H35c-6.1 0-11-4.9-11-11V27c0-6.1 4.9-11 11-11Z" fill="url(#page)" stroke="#bfdbfe" stroke-width="3"/>
    <path d="M80 17v19h19" fill="#bfdbfe"/>
    <path d="M45 88h36M45 98h27" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="mask-core" filter="url(#shadow)">
    <path d="M64 22c23 0 38 17.4 38 39 0 29.4-18 45-38 45S26 90.4 26 61c0-21.6 15-39 38-39Z" fill="#ffffff" stroke="#17202a" stroke-width="4"/>
    <path class="right-face" d="M64 25c20.1 0 33.4 15.1 33.4 35.7 0 24.5-14.9 40.7-33.4 40.7V25Z" fill="url(#maskBlue)"/>
    <path class="left-face" d="M64 25C43.9 25 30.6 40.1 30.6 60.7c0 24.5 14.9 40.7 33.4 40.7V25Z" fill="url(#maskRed)"/>
    <path d="M64 28c-8.7 8.1-12.7 16.2-12.7 24.5 0 7.2 4.5 12.8 12.7 16.8 8.2-4 12.7-9.6 12.7-16.8C76.7 44.2 72.7 36.1 64 28Z" fill="#f8fafc" opacity=".94"/>
    <path d="M39 56c6.5-7.7 13.6-8.3 21.1-1.8-6.4 7.3-13.5 7.9-21.1 1.8ZM88.9 56c-6.5-7.7-13.6-8.3-21.1-1.8 6.4 7.3 13.5 7.9 21.1 1.8Z" fill="#0f172a"/>
    <circle class="eye-dot" cx="49" cy="56" r="3.3" fill="#f8fafc"/>
    <circle class="eye-dot" cx="79" cy="56" r="3.3" fill="#f8fafc"/>
    <path d="M64 64c-4.8 5.8-7.2 10.5-7.2 14.2 0 3.7 2.4 5.8 7.2 6.4 4.8-.6 7.2-2.7 7.2-6.4 0-3.7-2.4-8.4-7.2-14.2Z" fill="#f59e0b" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M50 88c8.6 4.1 18.4 4.1 28 0" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 39c5.4-5.6 12.1-8.8 20-9.7M88 39c-5.4-5.6-12.1-8.8-20-9.7" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".82"/>
    <path class="whisker" d="M22 70c5.4 1.1 10.6 2.9 15.5 5.6M106 70c-5.4 1.1-10.6 2.9-15.5 5.6" stroke="#17202a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
